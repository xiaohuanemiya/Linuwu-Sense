PACKAGE_NAME="linuwu-sense"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="linuwu_sense"
# obj-m in the top-level Makefile is src/linuwu_sense.o, so the .ko lands in src/
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

# Drive the kernel build directly instead of the top-level "all" target: that target
# also runs the MOK auto-sign block, which calls sudo and would hang an unattended
# kernel upgrade. DKMS already runs as root and signs modules itself when a MOK is
# enrolled, so the block is redundant here.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
REMAKE_INITRD="no"
